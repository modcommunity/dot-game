[plugin]

name="dot-game"
description="The wiring every server game repeats: resolving the game object, building the netcode and its bridge, loading identity and services, driving one authoritative tick, keeping the roster, and unloading in reverse. Rules live in dot-match and dot-objective; this is the scaffolding underneath them. Depends on dot-core, dot-server and dot-net."
author="dot"
version="0.1.0"
script="dot_game_plugin.gd"
